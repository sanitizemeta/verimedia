<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <!-- Cyber Gradients -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="cyber-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <!-- Fading Mask for Grid -->
    <linearGradient id="mask-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <mask id="fade-right">
      <rect x="0" y="0" width="460" height="100" fill="url(#mask-grad)" />
    </mask>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Inter:wght@500;600&amp;display=swap');
    
    .brand-text {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      fill: #FFFFFF;
      font-size: 36px;
      letter-spacing: -0.01em;
    }
    
    .dot-text {
      fill: #00F0FF;
      font-weight: 700;
    }
    
    .subtitle-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      fill: #00F0FF;
      font-size: 10px;
      letter-spacing: 0.36em;
      opacity: 0.95;
    }
  </style>

  <!-- Optional Dark Background to standardise standalone rendering -->
  <rect width="460" height="100" rx="12" fill="#050B14" />

  <!-- Fading Cyber Grid in Background -->
  <g stroke="#0E1E36" stroke-width="0.75" mask="url(#fade-right)">
    <line x1="20" y1="0" x2="20" y2="100" />
    <line x1="40" y1="0" x2="40" y2="100" />
    <line x1="60" y1="0" x2="60" y2="100" />
    <line x1="80" y1="0" x2="80" y2="100" />
    <line x1="100" y1="0" x2="100" y2="100" />
    <line x1="120" y1="0" x2="120" y2="100" />
    <line x1="140" y1="0" x2="140" y2="100" />
    <line x1="160" y1="0" x2="160" y2="100" />
    <line x1="180" y1="0" x2="180" y2="100" />
    <line x1="200" y1="0" x2="200" y2="100" />
    <line x1="220" y1="0" x2="220" y2="100" />
    <line x1="240" y1="0" x2="240" y2="100" />
    
    <line x1="0" y1="20" x2="460" y2="20" />
    <line x1="0" y1="40" x2="460" y2="40" />
    <line x1="0" y1="60" x2="460" y2="60" />
    <line x1="0" y1="80" x2="460" y2="80" />
  </g>

  <!-- Left-Aligned Cyber Shield Icon -->
  <g transform="translate(15, 0) scale(0.9)">
    <!-- Outer Cyber Shield -->
    <path d="M 50 18 L 80 27 V 52 C 80 69 67 81 50 86 C 33 81 20 69 20 52 V 27 Z" 
          fill="url(#shield-grad)" 
          stroke="url(#cyber-emerald)" 
          stroke-width="3.5" 
          stroke-linejoin="round"
          filter="url(#subtle-glow)" />

    <!-- Inner Tech Plate -->
    <path d="M 50 25 L 73 32 V 51 C 73 64 63 74 50 78 C 37 74 27 64 27 51 V 32 Z" 
          fill="#040810" 
          stroke="#102A45" 
          stroke-width="1.5" 
          stroke-linejoin="round" />

    <!-- Cybernetic Accents/Dots -->
    <circle cx="50" cy="30" r="1.5" fill="#00F0FF" filter="url(#subtle-glow)" />
    <path d="M 24 33 L 30 35" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 76 33 L 70 35" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Neon Glowing Checkmark -->
    <path d="M 38 52 L 47 61 L 63 42" 
          fill="none" 
          stroke="#00F0FF" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neon-glow)" />
  </g>

  <!-- Wordmark Text Group -->
  <g transform="translate(110, 0)">
    <!-- Brand Title -->
    <text x="0" y="52" class="brand-text">VeriMedia<tspan class="dot-text">.xyz</tspan></text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="74" class="subtitle-text">SECURE DATA SOLUTIONS</text>
  </g>
</svg>
