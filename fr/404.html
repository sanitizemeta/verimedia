<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404. Page non trouvée | VeriMedia</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="/src/style.css">
  <script src="https://unpkg.com/lucide@1.16.0/dist/umd/lucide.min.js" defer></script>
  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      gap: 1.5rem;
    }

    .not-found-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--surface-raised);
      position: relative;
      user-select: none;
    }

    .not-found-code::after {
      content: '404';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent) 0%, transparent 60%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.18;
    }

    .not-found-icon {
      color: var(--accent);
      opacity: 0.7;
    }

    .not-found-title {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      margin: 0;
    }

    .not-found-sub {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 420px;
      line-height: 1.6;
      margin: 0;
    }

    .not-found-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .not-found-actions a {
      text-decoration: none;
    }

    .not-found-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .not-found-links a {
      font-size: 0.84rem;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--t-fast);
    }

    .not-found-links a:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <header></header>
  <noscript>
    <nav style="padding:1rem 0;display:flex;gap:1.5rem;align-items:center;">
      <a href="/fr/" style="color:#e8e4de;text-decoration:none;font-weight:700;">VeriMedia.xyz</a>
      <a href="/#calculator-section" style="color:#7a756d;text-decoration:none;">Tool</a>
      <a href="/#pricing-section" style="color:#7a756d;text-decoration:none;">Pricing</a>
      <a href="/fr/privacy/" style="color:#7a756d;text-decoration:none;">Privacy</a>
      <a href="/fr/terms/" style="color:#7a756d;text-decoration:none;">Terms</a>
      <a href="/fr/refund/" style="color:#7a756d;text-decoration:none;">Refund</a>
    </nav>
  </noscript>

  <div class="not-found-page">
    <div class="not-found-icon">
      <i data-lucide="shield-off" style="width:40px;height:40px;"></i>
    </div>

    <div class="not-found-code">404</div>

    <h1 class="not-found-title">Cette page n'existe pas</h1>
    <p class="not-found-sub">L'URL que vous avez suivie est peut-être cassée ou la page a été déplacée. Vos images sont toujours en sécurité. allez les protéger.</p>

    <div class="not-found-actions">
      <a href="/fr/" class="pricing-btn primary-btn">
        <i data-lucide="home" style="width:15px;height:15px;vertical-align:middle;margin-right:6px;"></i>
        Retour à VeriMedia
      </a>
      <a href="/fr/#calculator-section" class="pricing-btn secondary-btn">Protéger une image</a>
    </div>

    <div class="not-found-links">
      <a href="/fr/#pricing-section">Tarifs</a>
      <a href="/fr/#faq-section">FAQ</a>
      <a href="/fr/privacy/">Confidentialité</a>
      <a href="/fr/terms/">Conditions</a>
    </div>
  </div>

  <footer></footer>
  <noscript>
    <div style="border-top:1px solid rgba(255,255,255,0.05);padding:2rem 0;margin-top:2rem;">
      <p style="color:#3a3632;font-size:0.75rem;">
        <a href="/fr/" style="color:#7a756d;text-decoration:none;">Home</a> |
        <a href="/fr/ai-opt-out-metadata/" style="color:#7a756d;text-decoration:none;">AI Opt-Out Guide</a> |
        <a href="/fr/remove-exif-from-photos/" style="color:#7a756d;text-decoration:none;">EXIF Remover</a> |
        <a href="/fr/remove-pdf-metadata/" style="color:#7a756d;text-decoration:none;">PDF Cleaner</a> |
        <a href="/fr/knowledge/" style="color:#7a756d;text-decoration:none;">Knowledge Base</a> |
        <a href="/fr/privacy/" style="color:#7a756d;text-decoration:none;">Privacy</a> |
        <a href="/fr/terms/" style="color:#7a756d;text-decoration:none;">Terms</a> |
        <a href="/fr/refund/" style="color:#7a756d;text-decoration:none;">Refund</a>
      </p>
    </div>
  </noscript>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
  <script type="module" src="/src/site-chrome.js"></script>
</body>
</html>
