<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Shotglow Pro &mdash; Shotglow</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://verimedia.xyz/shotglow/buy/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#060606; --surface:#0c0c0c; --surface-raised:#141414;
      --accent:#7EC47E; --accent-hover:#9AD49A; --accent-dim:#4A7A4A; --accent-glow:rgba(126,196,126,0.15);
      --text-primary:#e8e4de; --text-secondary:#7a756d; --text-muted:#3a3632;
      --border:rgba(255,255,255,0.05); --border-active:rgba(126,196,126,0.25);
      --font-body:'IBM Plex Mono','Courier New',monospace;
      --font-display:'Bricolage Grotesque','Georgia',sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font-body); color:var(--text-primary); background:var(--bg); -webkit-font-smoothing:antialiased; }
    .wrap { max-width:560px; margin:0 auto; padding:64px 20px; }
    .card { background:var(--surface-raised); border:1px solid var(--border); border-radius:2px; padding:32px; box-shadow:0 8px 40px rgba(0,0,0,0.4); }
    h1 { font-family:var(--font-display); font-size:1.6rem; letter-spacing:-0.02em; margin:0 0 6px; }
    .sub { color:var(--text-secondary); font-size:.8rem; margin:0 0 24px; }
    .plans { display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
    .plan { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; background:var(--bg); border:1px solid var(--border); cursor:pointer; }
    .plan.selected { border-color:var(--border-active); box-shadow:0 0 0 1px var(--border-active), 0 0 24px var(--accent-glow); }
    .plan-name { font-size:.8rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
    .plan-price { font-family:var(--font-display); font-size:1.3rem; }
    .plan-note { color:var(--text-secondary); font-size:.68rem; margin-top:3px; }
    .badge { font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; color:var(--bg); background:var(--accent); padding:2px 7px; font-weight:700; }
    #buyBtn { width:100%; padding:15px; border:none; border-radius:0; background:var(--accent); color:var(--bg); font-family:var(--font-body); font-weight:700; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; cursor:pointer; }
    #buyBtn:hover { background:var(--accent-hover); }
    #buyBtn:disabled { background:var(--accent-dim); cursor:default; }
    .muted { color:var(--text-secondary); font-size:.68rem; text-align:center; margin-top:14px; line-height:1.6; }
    .muted a { color:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Shotglow Pro</h1>
      <p class="sub">Every Pro feature. Cancel anytime.</p>

      <div class="plans">
        <div class="plan selected" data-plan="annual" role="button" tabindex="0">
          <div>
            <div class="plan-name">Annual <span class="badge">Save 32%</span></div>
            <div class="plan-note">$49 billed yearly &mdash; about $4.08/mo</div>
          </div>
          <div class="plan-price">$49<span style="font-size:.7rem;color:var(--text-secondary)">/yr</span></div>
        </div>
        <div class="plan" data-plan="monthly" role="button" tabindex="0">
          <div>
            <div class="plan-name">Monthly</div>
            <div class="plan-note">Billed monthly</div>
          </div>
          <div class="plan-price">$5.99<span style="font-size:.7rem;color:var(--text-secondary)">/mo</span></div>
        </div>
      </div>

      <button id="buyBtn" disabled>Loading checkout&hellip;</button>
      <p class="muted">Secure checkout by Paddle, our Merchant of Record. Prices localized at checkout.<br /><a href="/refund/">Refund policy</a> &middot; <a href="/shotglow/privacy/">Privacy</a></p>
    </div>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js" id="paddleSdk"></script>
  <script>
    const PADDLE_TOKEN = 'live_2f19b88294a235307e74e44f820';
    const PRICES = {
      monthly: 'pri_01kxrckf8aszvc0fsj6svhq358',
      annual: 'pri_01kxrckfpxx2j3s4m6bh2nnf8f',
    };

    const params = new URLSearchParams(location.search);
    // The extension passes ?ext=<its id> so the success page can deep-link back.
    const extId = params.get('ext') || '';
    const successUrl = `${location.origin}/shotglow/success/${extId ? `?ext=${encodeURIComponent(extId)}` : ''}`;

    let selectedPlan = 'annual';
    document.querySelectorAll('.plan').forEach((el) => {
      const select = () => {
        document.querySelectorAll('.plan').forEach((p) => p.classList.remove('selected'));
        el.classList.add('selected');
        selectedPlan = el.dataset.plan;
      };
      el.addEventListener('click', select);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(); } });
    });

    const buyBtn = document.getElementById('buyBtn');
    let paddleReady = false;

    function showCheckoutUnavailable() {
      if (paddleReady) return;
      buyBtn.disabled = false;
      buyBtn.textContent = 'Checkout unavailable - retry';
    }

    function openCheckout() {
      if (!window.Paddle) { showCheckoutUnavailable(); return; }
      if (buyBtn.disabled) return;
      const checkout = {
        items: [{ priceId: PRICES[selectedPlan], quantity: 1 }],
        settings: { successUrl, displayMode: 'overlay', theme: 'dark', showAddDiscounts: true },
      };
      // Apply a discount code from the URL (?discount=CODE) - also covers
      // accounts where the overlay's discount field is hidden.
      const discount = params.get('discount');
      if (discount) checkout.discountCode = discount;
      Paddle.Checkout.open(checkout);
    }
    buyBtn.addEventListener('click', openCheckout);

    function initPaddle() {
      if (paddleReady || !window.Paddle) return;
      paddleReady = true;
      Paddle.Initialize({
        token: PADDLE_TOKEN,
        eventCallback: (e) => {
          if (e.name === 'checkout.completed') {
            // Carry the transaction id to the success page so it can fetch the
            // license key from the licensing worker (sessionStorage is the
            // fallback when Paddle redirects without our query param).
            const txn = e.data?.transaction_id || e.data?.id || '';
            if (txn) sessionStorage.setItem('paddle_txn', txn);
            location.href = txn ? `${successUrl}${successUrl.includes('?') ? '&' : '?'}txn=${encodeURIComponent(txn)}` : successUrl;
          }
        },
      });
      buyBtn.disabled = false;
      buyBtn.textContent = 'Unlock Pro';
      if (params.get('ext')) openCheckout();
    }
    if (window.Paddle) initPaddle();
    else window.addEventListener('load', () => window.Paddle && initPaddle());
    document.getElementById('paddleSdk')?.addEventListener('error', showCheckoutUnavailable);
    setTimeout(showCheckoutUnavailable, 6000);
  </script>
</body>
</html>
