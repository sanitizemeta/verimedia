<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Pro license key — Image Converter &amp; Compressor</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#060606; --surface:#0c0c0c; --surface-raised:#141414;
      --accent:#7EC47E; --accent-hover:#9AD49A; --accent-dim:#4A7A4A; --accent-glow:rgba(126,196,126,0.15);
      --text-primary:#e8e4de; --text-secondary:#7a756d; --text-muted:#3a3632;
      --border:rgba(255,255,255,0.05); --border-active:rgba(126,196,126,0.25);
      --font-body:'IBM Plex Mono','Courier New',monospace;
      --font-display:'Bricolage Grotesque','Georgia',sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font-body); color:var(--text-primary); background:var(--bg); -webkit-font-smoothing:antialiased; }
    .wrap { max-width:560px; margin:0 auto; padding:64px 20px; }
    .card { background:var(--surface-raised); border:1px solid var(--border); border-radius:2px; padding:32px; box-shadow:0 8px 40px rgba(0,0,0,0.4); }
    h1 { font-family:var(--font-display); font-size:1.5rem; letter-spacing:-0.02em; margin:0 0 16px; }
    .status { color:var(--text-secondary); display:flex; align-items:center; gap:10px; font-size:.85rem; }
    .spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .keybox { display:none; }
    .keybox.show { display:block; }
    .label { font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin:0 0 8px; }
    .key { display:flex; gap:8px; margin:8px 0 4px; }
    .key input { flex:1; padding:12px; border:1px solid var(--border-active); border-radius:0; font-family:var(--font-body); font-size:.85rem; background:var(--bg); color:var(--text-primary); }
    .key button { padding:12px 16px; border:none; border-radius:0; background:var(--accent); color:var(--bg); font-family:var(--font-body); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; cursor:pointer; }
    .key button:hover { background:var(--accent-hover); }
    .muted { color:var(--text-secondary); font-size:.72rem; }
    .steps { color:var(--text-secondary); font-size:.78rem; line-height:1.7; margin-top:16px; }
    .steps strong { color:var(--text-primary); }
    .activate { display:inline-block; margin-top:18px; padding:12px 18px; border-radius:0; background:transparent; border:1px solid var(--border-active); color:var(--accent); text-decoration:none; font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; }
    .activate:hover { background:var(--accent-glow); }
    .err { color:#e0707a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Thanks for your purchase</h1>

      <div id="status" class="status">
        <span class="spinner"></span>
        <span id="statusText">Preparing your license key…</span>
      </div>

      <div id="keybox" class="keybox">
        <p class="label">Your Pro license key</p>
        <div class="key">
          <input id="keyInput" readonly value="" />
          <button id="copyBtn" type="button">Copy</button>
        </div>
        <p class="muted">⚠ Save this key now — copy it somewhere safe before closing this page.</p>

        <div class="steps">
          <strong>Activate it:</strong><br />
          1. Open the Image Converter extension.<br />
          2. Paste this key into <em>Have a license key?</em><br />
          3. Pro unlocks instantly.
        </div>

        <a id="activateLink" class="activate" href="#" style="display:none">⚡ Activate in extension</a>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://image-converter-licensing.sanitizemeta.workers.dev';
    const DEFAULT_EXT_ID = 'nlcecbndoafikhnhchldfahojkelokam';

    const params = new URLSearchParams(location.search);
    const txn = params.get('txn') || params.get('_ptxn') || '';
    const extId = params.get('ext') || DEFAULT_EXT_ID;

    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const keybox = document.getElementById('keybox');
    const keyInput = document.getElementById('keyInput');

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(keyInput.value); document.getElementById('copyBtn').textContent = 'Copied'; } catch (_) {}
    });

    function showKey(key) {
      statusEl.style.display = 'none';
      keyInput.value = key;
      keybox.classList.add('show');
      const link = document.getElementById('activateLink');
      link.href = `chrome-extension://${extId}/activate.html?key=${encodeURIComponent(key)}`;
      link.style.display = 'inline-block';
    }

    function showError(msg, withRetry) {
      statusEl.innerHTML = `<span class="err">${msg}</span>`;
      if (withRetry) {
        const btn = document.createElement('button');
        btn.textContent = 'Check again';
        btn.style.cssText = 'margin-left:10px;padding:6px 12px;border:1px solid var(--border-active);background:transparent;color:var(--accent);font-family:var(--font-body);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border-radius:0;';
        btn.onclick = () => { statusEl.innerHTML = '<span class="spinner"></span><span>Checking…</span>'; poll(); };
        statusEl.appendChild(btn);
      }
    }

    // Poll until the verified webhook mints the key. Sandbox webhooks can lag, so
    // we give it ~2 minutes, then offer a manual re-check (the txn stays in the
    // URL, so refreshing works too).
    async function poll() {
      if (!txn) { showError("Missing transaction reference. Check your Paddle receipt email for your key, or contact support."); return; }
      const deadline = Date.now() + 120000;
      let delay = 1500;
      while (Date.now() < deadline) {
        try {
          const res = await fetch(`${WORKER_URL}/license-by-checkout?txn=${encodeURIComponent(txn)}`);
          const data = await res.json();
          if (data.ready && data.key) { showKey(data.key); return; }
        } catch (_) { /* keep polling */ }
        await new Promise((r) => setTimeout(r, delay));
        delay = Math.min(delay + 500, 4000);
      }
      showError("Your key is taking a little longer to confirm. Keep this page open — it'll appear here.", true);
    }

    statusText.textContent = 'Confirming your payment…';
    poll();
  </script>
</body>
</html>
